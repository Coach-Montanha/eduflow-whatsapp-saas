<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="purpleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="4" />
  <circle cx="256" cy="256" r="200" fill="url(#purpleAura)" />

  <g filter="url(#glow)">
    <!-- Chat Pulse Bubble + Signal Wave -->
    <path d="M 140 230 C 140 150 372 150 372 230 C 372 310 270 330 240 360 C 230 330 140 310 140 230 Z" fill="url(#purpleGrad)" />
    <path d="M 210 230 Q 256 190 302 230" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <!-- Monogram WA -->
    <text x="256" y="295" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="105" letter-spacing="4">WA</text>
  </g>

  <!-- Title Badge -->
  <text x="256" y="415" text-anchor="middle" fill="url(#purpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6">MONTANHA</text>
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4">WHATSAPP AUTOMATION</text>
</svg>
